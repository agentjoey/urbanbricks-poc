font emits the adjusted faces itself; the earlier no-emission claim was true only of the previous configuration that passed fallback:. Decision to omit fallback: kept, with the correct justification (a generic in the variable would bury the adjusted face behind sans-serif).  ITEM 3 (LOW): (a) 'triple-Archivo gone' claim made TRUE by fixing the code — stacks are now '--font-sans: var(--font-schibsted), "Helvetica Neue", sans-serif' and '--font-display: var(--font-archivo), "Helvetica Neue", sans-serif'; since each next/font variable already ends in its fallback face, the computed stacks carry each family/fallback exactly once (measured stackFallbackCount: 1 in the JSON). (b) outline-ring/50: rewording the comment was NOT sufficient — the string also lives in the append-only pact ledger (.pact/STATE.yml, log.jsonl), which Tailwind auto-detection scans. Durable fix: '@source not "../../.pact"' in globals.css (path is relative to the stylesheet; first attempt with ../.pact resolved to src/.pact and did nothing — caught by re-grepping the build). Final production CSS: 0 occurrences of outline-ring. (c) Grid negative-margin constraint for f4-shell documented on .grid-modules: cancellation is exact only while the grid fills its containing block inline size — never put max-width on .grid-modules itself, wrap it.  GATES (final state, probe route removed): pnpm verify:contrast ALL PASS exit 0; pnpm build exit 0 (CSS verified: 2 fallback faces, override rule present, 0 outline-ring); pnpm lint clean (zero warnings). UNVERIFIED: cross-browser (Firefox/Safari) rendering — per round-2 review this is accepted as a follow-up before first page ships, not a blocker. Note: two stale next dev servers (ports 3100/3101, not mine) are still running; an early measurement attempt accidentally hit one — the reported numbers are from a re-run against a real production next start on port 3210.
