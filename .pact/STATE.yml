        spec: .pact/tasks/_DECOMPOSITION.md
        evidence: Round 3 @ 8864999. Untouched per instructions: Schibsted swap/tnum proof, fallback cascade, focus ring, Module Grid maths, h3, dark-mode, scope leak, contrast script (verify-contrast.txt refreshed, still ALL PASS exit 0; script byte-identical, no threshold touched).  ITEM 1 (HIGH, line-height raise reaches .text-body): Confirmed the diagnosis first — production CSS compiles '.text-body{font-size:1.0625rem;line-height:var(--tw-leading,1.6)}', a literal baked by @theme inline. Remedy chosen: explicit scoped override '.ink-surface .text-body{line-height:1.65}' in globals.css, NOT scoping --tw-leading. Justification: --tw-leading is a Tailwind internal that can change in any minor release; the override relies only on the specified cascade (unlayered author CSS outranks @layer utilities regardless of specificity). The inherited-value line-height:1.65 on .ink-surface is kept for non-utility text. PROOF ON THE REAL PATH: temporary route src/app/probe-f1 with elements carrying class text-body inside .ink-surface, production build (pnpm build && next start), measured via CDP Chrome (ink-surface-text-body.json): text-body inside .ink-surface computes 17px/28.05px (ratio 1.65); text-body outside computes 27.2px (1.6, default surface unaffected); plain inheriting element inside .ink-surface computes 16px/26.4px (1.65). Probe route deleted after the run; the override rule is hand-written so it is emitted whether or not any page currently uses text-body (verified present in final build CSS).  ITEM 2 (MEDIUM, false Turbopack premise + duplicate faces): Removed both hand-declared @font-face blocks. Final production CSS carries exactly TWO fallback faces, both next/font's own ('Archivo Fallback' size-adjust 98.7%, 'Schibsted Grotesk Fallback' 104.49%), and --font-schibsted = '"Schibsted Grotesk", "Schibsted Grotesk Fallback"' (same shape for Archivo). Comments in layout.tsx and globals.css rewritten to state what is true of THIS build: with fallback: omitted, next/font emits the adjusted faces itself; the earlier no-emission claim was true only of the previous configuration that passed fallback:. Decision to omit fallback: kept, with the correct justification (a generic in the variable would bury the adjusted face behind sans-serif).  ITEM 3 (LOW): (a) 'triple-Archivo gone' claim made TRUE by fixing the code — stacks are now '--font-sans: var(--font-schibsted), "Helvetica Neue", sans-serif' and '--font-display: var(--font-archivo), "Helvetica Neue", sans-serif'; since each next/font variable already ends in its fallback face, the computed stacks carry each family/fallback exactly once (measured stackFallbackCount: 1 in the JSON). (b) outline-ring/50: rewording the comment was NOT sufficient — the string also lives in the append-only pact ledger (.pact/STATE.yml, log.jsonl), which Tailwind auto-detection scans. Durable fix: '@source not "../../.pact"' in globals.css (path is relative to the stylesheet; first attempt with ../.pact resolved to src/.pact and did nothing — caught by re-grepping the build). Final production CSS: 0 occurrences of outline-ring. (c) Grid negative-margin constraint for f4-shell documented on .grid-modules: cancellation is exact only while the grid fills its containing block inline size — never put max-width on .grid-modules itself, wrap it.  GATES (final state, probe route removed): pnpm verify:contrast ALL PASS exit 0; pnpm build exit 0 (CSS verified: 2 fallback faces, override rule present, 0 outline-ring); pnpm lint clean (zero warnings). UNVERIFIED: cross-browser (Firefox/Safari) rendering — per round-2 review this is accepted as a follow-up before first page ships, not a blocker. Note: two stale next dev servers (ports 3100/3101, not mine) are still running; an early measurement attempt accidentally hit one — the reported numbers are from a re-run against a real production next start on port 3210.
      - id: f2-content
        owner: build
        status: changes_requested
        reviewer: review
        spec: .pact/tasks/_DECOMPOSITION.md
        evidence: Commit af46c8c on feat/poc. DELIVERABLE 1 — unverified() mechanism (src/lib/unverified.ts): Unverified<T> carries a nominal brand keyed on a module-private unique symbol, so nothing outside the module can construct one except unverified(); factual fields in content are typed Unverified<T>, hence a raw value is a compile error, not a convention. The object also carries a runtime __unverified marker — this is what makes the mechanism reach the real path: verify:content and dev badges inspect the actual runtime values a page would render, not source text. Brand/marketing copy is unwrapped by design. Dev rendering: isUnverified() + UNVERIFIED_BADGE_LABEL exported for C2-spec-table to badge values; the component itself is C2's job. verify:content (scripts/verify-content.mjs + package.json entry) compiles src/content + the two lib files via scripts/tsconfig.verify.json (CJS, into gitignored .cache/), walks every export of all four content modules at runtime, and prints each unverified value with file path, object path, value preview and its confirmation note; exits 1 while any remain. Current output: 47 values listed (contact email/phone, currency, units, all model specs/claddings/priceBands, install duration, 3 warranty periods, aftercare response days), exit code 1 — the pre-launch checklist generates itself. DELIVERABLE 2 — factoryBuildDays: 30, scope enforced by types (src/lib/delivery.ts): FactoryDelivery stores the figure behind a module-private runtime symbol — there is NO readable .days property at all. The only accessor, deliveryStatement(), returns { days, headline, covers, customerSide }: the number exists in app code exclusively bundled with its scope sentences. factoryDelivery() also runtime-throws on blank scope strings. Confirmed scope wording: 30 days covers factory build (fabrication, fit-out, inspection); groundwork, planning permission and connections are the customer's side, run in parallel, NOT included. Singleton FACTORY_BUILD_TIME in site.ts is shared by every model's factoryBuildDays field, the speed selling point, and the process factory track — one source, no drift. Bypass audit (f1 lesson): a page author cannot get the number without simultaneously holding the scope — no property read, no destructure, no JSON path exposes it; the only way to render 30 bare would be to deliberately retype the field, which is not an accident. DELIVERABLE 3 — content files: site.ts (company info, unverified contact, 3 selling points matching spec §1 speed/value/aftercare, single currency + units configs — no currency baked into any field name, proof slots testimonials/caseStudies/certifications/deliveredBuildings all EMPTY per the never-invent red line); models.ts (seven models matching docs/render-prompts.md exactly: harbor-20, harbor-40, meridian, meridian-stack residential; counter, workroom, basecamp commercial; each with slug/name/category(20ft|40ft|multi-unit)/useCase/specs/priceBand/features/image slots at 5:2 hero, 3:2 card, 4:3 shared interior, alt text; Visualisation caption documented as non-removable in C3, not an optional flag here); process.ts (two parallel tracks — factory:urbanbricks carrying FACTORY_BUILD_TIME on the build step vs site:customer with planning/groundwork/connections, customer-side steps carry NO promised durations per spec §3; parallelNote states the mechanism; warranty with 3 wrapped terms + aftercare); faq.ts (9 items, segment-tagged: 2 residential-specific, 2 commercial-specific; every answer stating 30 days states its coverage; no unverified numbers quoted in prose). ACCEPTANCE — deliberate failure 1 (temp file src/content/__fail-unverified.ts, priceBand passed unwrapped): src/content/__fail-unverified.ts(5,16): error TS2353: Object literal may only specify known properties, and 'from' does not exist in type 'Unverified<PriceBand>'. Deliberate failure 2 (temp file src/content/__fail-delivery.ts, factoryBuildDays: 30 bare): src/content/__fail-delivery.ts(5,3): error TS2322: Type 'number' is not assignable to type 'FactoryDelivery'. Both temp files deleted after capture; tsc clean again. Additionally src/content/type-tests.ts holds PERMANENT @ts-expect-error guards for both red lines plus the .days-extraction attempt — if enforcement ever weakens, tsc fails with unused-directive errors. GATES: pnpm exec tsc --noEmit exit 0; pnpm verify:content exit 1 listing 47 values (expected — nothing confirmed yet); pnpm lint clean (added .cache/** to eslint globalIgnores for the compiled scratch output); pnpm build exit 0 (Next 16.2.10 Turbopack, TypeScript finished, 4/4 static pages). Left uncommitted: spec §10 edit about Neon provisioning (belongs to f3-db work, not mine). f1-tokens files untouched.
      - id: f3-db
        owner: build
        status: awaiting_review
        reviewer: review
        spec: .pact/tasks/_DECOMPOSITION.md
        evidence: Commit 72a174e on feat/poc. FILES: src/db/schema.ts, src/db/index.ts, drizzle.config.ts, .env.example, drizzle/0000_skinny_thor_girl.sql (+meta), scripts/verify-db.ts, package.json scripts (db:generate/db:migrate/verify:db), deps drizzle-orm 0.45.2 + @neondatabase/serverless 1.1.0 + drizzle-kit 0.31.10 + tsx + @next/env. SCHEMA per spec §4: uuid pk defaultRandom, created_at timestamptz defaultNow, name/email NOT NULL, phone/country nullable, model_slug nullable (null = /contact), project_type/timeline/budget_band as Postgres ENUMS (not free text — the POC's intent instruments stay aggregable; timeline declared cold-to-hot so enum order = intent strength), source_path NOT NULL, utm_source/medium/campaign nullable, consent_at timestamptz NOT NULL (consent mandatory per spec §4 form rules). NO ip / user-agent columns. BUDGET BAND NOTE (my modeling decision within the task mandate): bands under-40k/40k-60k/60k-90k/90k-120k/over-120k aligned with models.ts priceBands (31k-118k); currency itself still unverified() — comment in schema says re-cut via new migration if confirmed currency shifts magnitudes. CLIENT: drizzle-orm/neon-http over @neondatabase/serverless — one-shot HTTPS, the exact Server Action/RSC shape; no TCP pool to exhaust on Vercel. Docs read fresh (orm.drizzle.team neon guide, neon.com serverless-driver, node_modules/next/dist/docs environment-variables) — no remembered APIs. ENV: client validates DATABASE_URL at module load and throws a clear actionable message; drizzle.config.ts loads env via @next/env loadEnvConfig (Next's own documented pattern) so CLI runs resolve the same .env.local. MIGRATION: drizzle-kit generate produced 0000 (3 CREATE TYPE + CREATE TABLE, verified line-by-line against spec §4); drizzle-kit migrate APPLIED to live Neon ('migrations applied successfully'). REAL-PATH EVIDENCE (the f1 question asked): scripts/verify-db.ts imports the same src/db/index.ts client a Server Action will use — not a probe. pnpm verify:db exit 0: INSERT SQL shown (parameterized), insert returned 1 row; SELECT by id returned 1 row with projectType/timeline/budgetBand/modelSlug round-trip matching; DELETE removed 1 row, 0 remaining; negative test (insert without name, TS bypassed to reach the DB) rejected with actual Postgres error 'null value in column "name" of relation "leads" violates not-null constraint' (found in error.cause — first script version only checked the drizzle wrapper and false-FAILED; fixed to walk the cause chain, reran, all PASS). ENV GUARD: importing src/db with DATABASE_URL unset throws 'DATABASE_URL is not set, so the leads database cannot be reached. Locally: copy .env.example... On Vercel: set DATABASE_URL...' — verified, not the opaque driver error. GATES: npx tsc --noEmit clean; pnpm lint clean; pnpm build exit 0 (4/4 static). SECURITY: host/password fragments extracted from .env.local in-shell (never printed) — 0 matches in tracked files, 0 in new files, 0 in the commit diff; .env.local confirmed gitignored; .env.example has placeholders only; evidence contains no credentials. UNVERIFIED: nothing on the db path — but note no page/Server Action consumes the client yet (that is C1/A1), so 'real request path' currently means the real client module exercised over the live connection, which is as far as f3's scope reaches.
