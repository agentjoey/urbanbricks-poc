ation unavailable', stacked 5/4.125, 4:3 interior, ContextPhoto label), 04-dark-surface.png (ink-surface band: placeholder border uses border-border → Line On Dark after I caught border-line rendering ~14:1 near-white on dark in round 1 and fixed it; caption Muted On Dark). SSR HTML: 8 render labels + 1 context label = 9 figcaptions for 9 instances — label is in server HTML, not a client effect. FORMATS: real /_next/image endpoint — Accept avif,webp → image/avif 3235B (file(1): 'ISO Media, AVIF Image'); webp-only → image/webp 6818B (RIFF Web/P VP8 1200x800); png-only → source passthrough; missing src → optimizer 400 → onerror → error placeholder. next.config images.formats ['image/avif','image/webp'] (Next 16 default is webp-only). LCP uses preload (priority deprecated in Next 16 — verified in node_modules/next/dist/docs + get-img-props.d.ts). Placeholders are bordered boxes with words in surface tokens — no coloured panels/gradients. Fade-in is motion-safe: only. GATES (final tree, probe deleted): npx tsc --noEmit PASS full tree; pnpm lint 0 errors (1 warning in c1's scripts/probe-c1-cdp.mjs, not c3); pnpm build PASS; pnpm verify:contrast ALL PASS; pnpm verify:content exit 1 with the same 47 unverified values as f2-accepted baseline (expected, untouched). UNVERIFIED: cross-browser Firefox/Safari (same follow-up as f1); no page consumes the component yet (p1–p6) — real path exercised = the component through the production pipeline, as far as c3 scope reaches.
