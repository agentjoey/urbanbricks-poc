        evidence: Rework @ a325ebc, all ten items addressed. Evidence index: .pact/tasks/f1-tokens-evidence/README.txt.  CHECKS: pnpm verify:contrast ALL PASS (16 tokens incl. line-on-dark/stroke-on-dark drift-checked against DESIGN.md, exits 0 — output in verify-contrast.txt). pnpm build OK. pnpm lint clean (zero warnings).  1. FONT SWAP: layout.tsx now wires Schibsted_Grotesk -> --font-schibsted; --font-sans rebuilt; Golos gone. Gate 3 re-proven at the binary level on the ACTUAL SERVED woff2 (.next/static/media/31a9145ccb84606d-s.p.3j3x29wbycqkn.woff2, latin subset): fontTools resolves the tnum single-subst for all ten digits — every .tf advance = 1300/2048em, spread EXACTLY 0; upstream google/fonts main (v1.100) identical tables. schibsted-tnum-analysis.txt. Browser: all ten digits render 40.63px @64px with tnum on, max delta 0.00px; tabular 11111.11 == 88888.88 (325px), proportional differs (166.72 vs 285.28).  2. GATE 2 FIXED + PROVEN THROUGH THE CASCADE: fallback: removed from both next/font calls so variables hold only the real family; computed stacks now 'Schibsted Grotesk, Schibsted Grotesk Fallback, ..., Helvetica Neue, sans-serif' (adjusted face immediately after real family, before any generic; same for Archivo; triple-Archivo gone). New Schibsted metrics applied (104.49/93.46/24.67). Proof: CDP-driven Chrome with *.woff2 blocked at network layer (cache disabled, fresh target) — faces go to status error, plain element inheriting font-sans AND a font-sans-utility element (neither names a fallback family) measure 411.34px vs raw Arial 393.69px = 1.0449 = exactly size-adjust; display probe 0.9868x = 98.7%. font-gates-blocked.json/png. Note: document.fonts.delete() cannot suppress CSS-connected faces (Blink re-adds on recalc) — that is why blocking is at network layer.  3. INK SURFACE COMPLETE: line-height 1.65 inside .ink-surface (measured 28.05px/17px); --border -> var(--line-on-dark), --input -> var(--stroke-on-dark); both new tokens in :root + @theme inline. Measured: hairline inside .ink-surface resolves exactly to a var(--line-on-dark) control.  4. FOCUS RING: outline-ring/50 dropped; base rule '*:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px }'. Measured via real :focus-visible matching (autofocus + chained focus): light surface -> Ink 2px/2px; inside .ink-surface -> On Dark 2px/2px. Visible in font-gates.png.  5. MODULE GRID REBUILT: fixed column count per breakpoint (1 / 2 @48rem / 4 @80rem, never auto-fit) so cell boundaries are addressable; gutter derived as r x cell width with r = --module-gap-ratio = 0.025 (joining gap = 1/40 of module length, single declared constant); column gutter via g = 100%·r/(n+r(n−1)), row gutter via grid-item % margins (resolve against the grid AREA = cell width — percentage row-gap provably resolves against indefinite block size and cannot express this; probe-tested). Stacked crop corrected to 5/(4+5r) = 5/4.125. 18rem magic and unused moduleWidth() deleted. Measured @1440px: 4 cols, gutter/cell = 0.0250 both axes, span-2 = 2 cells + 1 gutter (691.73 vs 691.72 expected), span-3 exact, trailing gutter residue 0. Measured @400px: collapses to 1 col, spans fall back to span 1 (no implicit tracks, no overflow), row gutter/cell = 0.025. font-gates.json + font-gates-mobile.json.  6. h3 back in body face: display family + font-stretch scoped to h1,h2; text-wrap:balance kept on h1-h3 (Balance Rule only). Built CSS: 'h1,h2{font-family:var(--font-display);font-stretch:125%}', 'h1,h2,h3{text-wrap:balance}'.  7. DARK MODE STRUCTURAL: @custom-variant dark (&:where(.dark, .dark *)) — dark: utilities now compile to .dark-class selectors; zero prefers-color-scheme rules in production CSS (grep + in-page count of live media rules = 0). Scaffold page.tsx untouched.  8. SCOPE: h-full/antialiased/min-h-full/flex removed from layout.tsx (f4-shell's).  9. COMMENTS RECONCILED: layout.tsx no longer claims adjustFontFallback emits the fallback face; both files state the Turbopack finding and why fallback: is omitted.  10. (§10 note acknowledged — Turbopack registers literal family names; gates interpreted accordingly.)  UNVERIFIED/CAVEATS: (a) grid measurements are headless-Chrome only; Firefox/Safari not run — var() inside repeat() and % grid-item margins are spec-backed but untested there. (b) Row gutter uses grid-item margins + a trailing negative margin on the grid; exact while the grid fills its containing block (documented in globals.css). (c) Gutter ratio 0.025 is a declared design constant (documented derivation: joining gap as 1/40 of module length), not a Human-Owner-approved number — flag to lead if it needs recording in DESIGN.md. (d) Focus ring verified in Chrome; Safari :focus-visible heuristics not run.
