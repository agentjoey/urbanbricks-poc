        evidence: Tokens: globals.css rewritten to the urbanbricks system — all 14 DESIGN.md colors in OKLCH verbatim + brass-hover; shadcn aliases rebound to brand tokens; radius 2/4/8px (0.625rem default removed); spacing xs-xl (8/16/32/64/120); type scale (display/headline/title/body/label); Detached shadow token. No .dark theme — dark sections opt in via .ink-surface scope which swaps in the mandatory dark counterparts (brass for figures, muted-on-dark, on-dark ring, on-dark states). Module Grid: --module-cell-min/--module-gap/--aspect-module + grid-modules, cell-span-2/3, aspect-module(-stacked) utilities; src/lib/grid.ts constants. Fonts: Archivo variable with axes:['wdth'] + Golos Text via next/font in layout.tsx, self-hosted, zero external requests.  Checks: pnpm verify:contrast ALL PASS (15/15, output in .pact/tasks/f1-tokens-evidence/verify-contrast.txt). pnpm build OK. pnpm lint OK (1 pre-existing warning in scripts/verify-contrast.mjs, untouched).  FONT GATES (rendered proof: .pact/tasks/f1-tokens-evidence/font-gates.png + font-gates.json, headless Chrome against next dev): - Gate 1 wdth: PASS. Built CSS serves Archivo @font-face with font-stretch:62% 125%; h1 applies font-stretch:125% (computed style '125%'); same text renders 868.45px expanded vs 678.67px normal = 1.28x. Screenshot shows visible expansion. - Gate 2 size-adjust: PASS with caveat. Next 16.2.10 Turbopack does NOT emit next/font's automatic adjusted fallback face (verified: no ascent-override in built CSS), so explicit fallback @font-face rules with Next's own precalculated metrics are declared in globals.css and present in the production build. Browser proof: Arial at size-adjust 108.57% ('Golos Text Fallback') measures 370.63px vs raw Arial 341.39px = 1.0856x; 'Archivo Fallback' 336.92px = 0.987x — overrides verifiably applied; fallback faces registered and loaded per document.fonts. - Gate 3 tnum: *** FAILS — reported explicitly, not silently skipped. ***. The served Golos Text build (v2.004, latin subset) HAS a tnum GSUB feature but it is DEFECTIVE IN THE SOURCE FONT ITSELF (identical defect in google/fonts upstream, the latest release): digits 0,1,4,7 equalise to 620 units, but 2,3,5,6,8,9 keep proportional advances 580-610. Chrome-rendered per-digit widths with tnum on match the binary advances exactly (2.56px spread at 64px). Full analysis: .pact/tasks/f1-tokens-evidence/golos-tnum-analysis.txt. Per DESIGN.md gate 3, the body-font choice must be revisited by lead/Human Owner — the spec-table signature component (C2) will not get aligned tabular columns from Golos Text. I did not substitute another font unilaterally; Golos Text remains wired per DESIGN.md pending that decision.  Unverified: nothing else — all other claims backed by artifacts above.
