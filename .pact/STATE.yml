      - id: c3-image
        owner: build
        status: changes_requested
        reviewer: review
        spec: .pact/tasks/_DECOMPOSITION.md
        evidence: Commit 4675c7f on wt/c3. FILES: src/components/render-image/render-image.tsx, scripts/verify-image-label.mjs, package.json.  ITEM: ancestor caption suppression.  1. CSS hardening (src/components/render-image/render-image.tsx:195):    <figcaption className="mt-2 text-label! block! visible! opacity-100! text-muted-foreground">    This defeats descendant-selectors that target the caption directly:    - [&_figcaption]:hidden → block! keeps it display:block.    - [&_figcaption]:opacity-0 → opacity-100! keeps it opaque.    - text-[0px] on an ancestor → text-label! keeps the caption at the labelled size.    It does NOT defeat ancestor display:none (hidden / hidden!), sr-only, ancestor opacity-0 (opacity on a subtree cannot be overridden by a child), or fixed-height overflow-hidden clipping. Those are caught by the build guard.  2. Build-time guard (scripts/verify-image-label.mjs):    - Scans src/**/*.tsx for <RenderImage> and <ContextPhoto>.    - Walks ancestor JSX elements and inspects static className strings (string literals + cn/clsx/classNames literals).    - Fails loudly with file:line and the matched idiom.    - Wired into pnpm verify:image-label and as a prebuild hook, so pnpm build runs it before Next.js.    - Patterns covered: [&_figcaption]:hidden, sr-only, opacity-0, text-[0px], hidden/hidden!, and fixed-height overflow-hidden wrappers.  PROOF — scanner fails each idiom (probe page src/app/probe/page.tsx created then deleted):    src/app/probe/page.tsx:10  idiom: [&_figcaption]:hidden   className: [&_figcaption]:hidden border p-2   src/app/probe/page.tsx:17  idiom: sr-only                className: sr-only border p-2   src/app/probe/page.tsx:24  idiom: opacity-0              className: opacity-0 border p-2   src/app/probe/page.tsx:31  idiom: text-[0px]             className: text-[0px] border p-2   src/app/probe/page.tsx:38  idiom: hidden / hidden!       className: hidden! border p-2   src/app/probe/page.tsx:45  idiom: fixed-height overflow-hidden wrapper  className: h-20 overflow-hidden border p-2  A production build of the probe page (next build --webpack, bypassing the prebuild hook only so the malicious page could render) served on port 3603 was screenshotted with Chrome headless. The screenshot shows the [&_figcaption]:hidden and text-[0px] sections still render the mandatory 'Visualisation — not a photograph of a delivered building.' caption, confirming the hardened styles work where CSS can work. The sr-only, opacity-0, hidden!, and overflow-hidden sections correctly hide or clip the component; those routes are closed by the scanner, not by CSS.  3. Comment correction (render-image.tsx header):    Replaced the false claim that the closed union 'closes the one real escape route' with an accurate statement: the union only blocks the prop-level escape route; ancestor wrappers are still possible and are caught by verify:image-label; residual gaps (runtime className expressions, inline styles, injected <style>, non-ancestor DOM changes) remain possible and are documented.  GATES (clean tree, probe deleted): - pnpm verify:image-label → exit 0, no ancestors found. - pnpm build → exit 0 (prebuild runs the scanner, then next build --webpack). - pnpm lint → exit 0. - pnpm verify:contrast → ALL PASS exit 0. - pnpm verify:content → exit 1 BY DESIGN (same 47 unverified() values left by f2-content; not touched by this task). - npx tsc --noEmit → clean.  NOTE: package.json build script changed to 'next build --webpack' because Turbopack panics on this isolated worktree's out-of-root node_modules symlink; webpack builds cleanly.  RESIDUAL GAPS (honest limits): - The scanner only sees static className strings; runtime expressions / imported variables that build a suppression class are not caught. - Inline styles, runtime-injected <style> blocks, and non-ancestor DOM manipulation can still hide the caption. - CSS hardening cannot defeat ancestor display:none, sr-only, ancestor opacity-0, or clipping overflow; those rely on the scanner. - The pattern list is a known-idiom allowlist, not a complete CSS theorem prover.
