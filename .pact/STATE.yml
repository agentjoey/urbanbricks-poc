        evidence: Commit a592661 on feat/poc.  ITEM 1 (BLOCKER — bare number through the sanctioned accessor): Redesigned src/lib/delivery.ts so NO number exists anywhere on the public surface. DeliveryStatement dropped 'days: number'; it now carries four self-scoping strings, each naming what the days cover: short ('30 days (factory build)' — the compact form for the C2 spec table's Deep Brass Title-weight right column, where a full sentence is wrong; chosen over '30 days' because it still states its coverage when pasted alone), headline ('Built in 30 days in our factory'), covers, customerSide. factoryDelivery now takes the scope sentences as a FUNCTION of the figure (days)=>DeliveryScope, so the number inside the prose is derived, and runtime-throws if either scope sentence omits the figure. PROOF via the exact probe from the review: a temp probe-f2.ts containing verbatim 'const { days } = deliveryStatement(FACTORY_BUILD_TIME); export const headline = `Open in ${days} days`;' — npx tsc --noEmit failed with: probe-f2.ts(4,9): error TS2339: Property 'days' does not exist on type 'DeliveryStatement'. Probe deleted after the run. type-tests.ts gained permanent @ts-expect-error guards for both escape paths (.days access and the destructure), so tsc keeps proving it on every run. Header comment at delivery.ts rewritten to state what is now true, including the honest limit: hand-written bad copy cannot be type-blocked; what is guaranteed is that the bare number does not exist to be picked up and every string the sanctioned path emits is safe alone.  ITEM 2 (HIGH — silent miss): scripts/tsconfig.verify.json include now globs ../src/content/*.ts; scripts/verify-content.mjs globs the compiled output dir instead of a hardcoded 4-file map (type-tests.js is compiled — so its probes are re-proven every run — but skipped at require time, documented why). PROOF: added a temp src/content/probe-extra.ts exporting an unverified() value; verify:content listed it as src/content/probe