      - id: c3-image
        owner: build
        status: accepted
        reviewer: review
        spec: .pact/tasks/_DECOMPOSITION.md
        evidence: Commit 8fb8da8 on wt/c3. FILES: scripts/verify-image-label.mjs, src/components/render-image/render-image.tsx.\n\nDECISION: inverted the scanner from a blocklist to a closed allowlist of safe ancestor class tokens. Anything not listed is rejected by default; novel spellings cannot walk past.\n\nWHAT CHANGED:\n1. scripts/verify-image-label.mjs — rewritten as allowlist scanner.\n   - Parses every class token into variant(s) + base. Only known safe variants pass; arbitrary variants such as [\&_figcaption]:hidden are rejected.\n   - Base-token allowlist covers Module Grid (cell-span-*, grid-modules), plain layout, spacing, sizing, borders, backgrounds, typography, aspect, object-fit, etc.\n   - Special rules: hidden is allowed only when paired with a responsive display token (e.g. hidden md:block); unconditional hidden/hidden! fail. opacity-0 is allowed only when paired with opacity-100 in the same class string; standalone opacity-0/opacity-0! fail.\n   - Hiding classes (sr-only, text-transparent, text-[...], invisible, collapse, h-0, max-h-0) are rejected.\n   - cn/clsx/classNames walker reads string literals, ternaries, &&/||, and object-literal keys, but skips object keys whose value is the literal false.\n   - Structural cases: follows an element hoisted into a same-file variable; inspects the root returned JSX element of a same-file wrapper component. Adds greppable escape hatch data-image-label-exempt.\n2. src/components/render-image/render-image.tsx — header comment rewritten to state the allowlist policy and its honest limits; no longer describes a fixed idiom list as if it were complete.\n\nPROOF:\n- Bypass probe (temporary src/components/render-image/probe-bypass.tsx, deleted before commit): scanner exit 1 and reported all 9 direct bypass cases plus the two structural bypasses:\n  [\&_figcaption]:hidden, sr-only, text-transparent, opacity-0, text-[0px], hidden, hidden!, opacity-0!, invisible, hoisted <RenderImage/> inside hidden, and a same-file <HidingWrapper> whose root returns className="hidden".\n- Legitimate-pattern probe (temporary src/components/render-image/probe-legit.tsx, deleted before commit): scanner exit 0 with all 7 false-positive patterns plus structural safe cases:\n  hidden sm:table-cell, hidden md:list-item, h-[38rem] overflow-hidden, cn("grid", {"sr-only": false}), cond ? "opacity-0" : "opacity-100", grid gap-6 md:grid-cols-2 max-w-3xl, text-balance text-base, hoisted element in a grid wrapper, same-file <SafeWrapper> root grid, and data-image-label-exempt.\n- No-JS / regression probe (temporary route src/app/probe-c3/page.tsx, deleted before commit). Production build + next start -p 3633, curl of SSR HTML: 4 figcaptions (3× Visualisation — not a photograph of a delivered building., 1× Context photograph — not an urbanbricks building.), 7 opacity-100, 0 opacity-0, pending placeholder rendered. Proof exercises our rig because no visitor page consumes the component yet.\n- Final clean-tree gates: npx tsc --noEmit exit 0; pnpm lint exit 0; pnpm verify:contrast ALL PASS; pnpm build (Next 16.2.10 Turbopack) exit 0 with route table / and /_not-found only; pnpm verify:image-label exit 0. pnpm verify:content exit 1 with the same 47 pre-existing unverified() placeholders as the accepted baseline — not a regression.\n\nHONEST LIMITS (stated plainly):\n- The scanner only reads static className strings it can parse; runtime expressions, imported variables, inline styles, injected <style> blocks, and non-ancestor DOM manipulation are out of scope.\n- It does not cross file boundaries; a wrapper component imported from another file is not inspected inside.\n- It does not descend into props/state-built classNames inside a wrapper.\n- overflow-hidden and fixed heights are both allowed individually, so a malicious h-8 overflow-hidden ancestor is not rejected. opacity-0 paired with opacity-100 is allowed as a state-transition pattern. The data-image-label-exempt escape hatch is greppable but can be misused; it is for legitimate exceptions.\n- No Neon rows touched.
